<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DNSi">
  <!-- DNSi icon: neutral dark tile with a filled light speech bubble (DNS
       asks) and a dark question mark cut into it (AI answers). Deliberately
       built from large filled shapes, not thin outlines, so it survives at
       16 px. Monochrome, matching the site's ink/paper palette. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none"
        stroke="#333333" stroke-width="4"/>

  <!-- bubble body + tail, one filled path -->
  <path fill="#e8e8e6" d="M96 132
           a48 48 0 0 1 48-48h224a48 48 0 0 1 48 48v152a48 48 0 0 1-48 48H196l-58 58a10 10 0 0 1-17-7v-51h-1a48 48 0 0 1-24-41z"/>

  <!-- question mark: arc, stem, dot, cut out of the bubble in tile colour -->
  <g fill="none" stroke="#141414" stroke-width="44" stroke-linecap="round">
    <path d="M188 178a60 60 0 1 1 96 48v34"/>
  </g>
  <circle cx="284" cy="300" r="24" fill="#141414"/>

  <!-- gray accent: a second, answered bubble edge, echoing the site's two-tone mark -->
  <path fill="none" stroke="#6a6a6a" stroke-width="40" stroke-linecap="round"
        d="M356 372h40"/>
</svg>
