<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNSi Docs</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #9aa7b3;
    --accent: #4ade80;
    --code-bg: #010409;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.7 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 24px 80px; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0; border-bottom: 1px solid var(--border); margin-bottom: 40px;
  }
  .brand { color: var(--accent); font-weight: 700; font-size: 17px; text-decoration: none; }
  .brand span { color: var(--text); }
  .actions a {
    display: inline-block; margin-left: 10px; padding: 6px 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
    color: var(--text); text-decoration: none; font-size: 13.5px;
  }
  .actions a:hover { border-color: var(--accent); }
  #content { font-size: 15.5px; }
  #content h1 { font-size: 30px; letter-spacing: -0.5px; margin: 28px 0 16px; line-height: 1.2; }
  #content h2 { font-size: 21px; margin: 34px 0 12px; padding-top: 18px; border-top: 1px solid var(--border); }
  #content h3 { font-size: 17px; margin: 24px 0 8px; }
  #content p { margin: 10px 0; }
  #content a { color: var(--accent); }
  #content ul, #content ol { margin: 10px 0 10px 26px; }
  #content li { margin: 4px 0; }
  #content blockquote {
    border-left: 3px solid var(--accent); background: var(--panel);
    padding: 10px 18px; margin: 14px 0; border-radius: 0 8px 8px 0; color: var(--muted);
  }
  #content code {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 1px 6px; font-size: 0.88em; font-family: ui-monospace, Consolas, monospace;
  }
  #content pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; overflow-x: auto; margin: 14px 0;
  }
  #content pre code { border: none; background: none; padding: 0; }
  #content table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  #content th, #content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  #content th { background: var(--panel); color: var(--muted); }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 26px 0; }
  #error { display: none; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html">DNSi <span>docs</span></a>
    <div class="actions">
      <a href="#" onclick="history.back(); return false;">Back</a>
      <a href="index.html">Home</a>
    </div>
  </div>
  <div id="content" aria-live="polite"></div>
  <div id="error">
    <p>Could not load this document. <a href="index.html">Back to the landing page.</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  // Only these files may be loaded (no arbitrary fetch proxy).
  var DOCS = {
    "PLAIN.md": "DNSi in plain words",
    "PROTOCOL.md": "Protocol Specification",
    "AGENTS.md": "For agents and devices",
    "ARCHITECTURE.md": "Architecture",
    "OPERATIONS.md": "Running DNSi"
  };
  var params = new URLSearchParams(location.search);
  var doc = params.get("doc") || "PLAIN.md";
  var box = document.getElementById("content");
  var err = document.getElementById("error");

  if (!Object.prototype.hasOwnProperty.call(DOCS, doc)) {
    err.style.display = "block";
  } else {
    document.title = "DNSi: " + DOCS[doc];
    fetch(doc, { headers: { "accept": "text/plain" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        if (typeof marked === "undefined") throw new Error("renderer unavailable");
        box.innerHTML = marked.parse(text);
      })
      .catch(function () {
        box.style.display = "none";
        err.style.display = "block";
      });
  }
</script>
</body>
</html>
