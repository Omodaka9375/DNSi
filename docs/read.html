<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNSi Docs</title>
<meta name="theme-color" content="#101010">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Same monochrome editorial system as index.html, scoped to the reader. */

:root {
  color-scheme: light dark;
  --ink:       #111111;
  --ink-2:     #333333;
  --ink-3:     #666666;
  --ink-4:     #999999;
  --paper:     #ffffff;
  --paper-2:   #f4f4f2;
  --paper-3:   #ececea;
  --rule:      #d9d9d6;
  --rule-dark: #111111;
  --sel:       #111111;
  --sel-text:  #ffffff;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans:  "Helvetica Neue", Helvetica, Inter, "Segoe UI", Arial, sans-serif;
  --mono:  ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --max: 1060px;
}
html[data-mode="dark"] {
  color-scheme: dark;
  --ink:      #e8e8e6;
  --ink-2:    #c8c8c6;
  --ink-3:    #909090;
  --ink-4:    #6a6a6a;
  --paper:    #101010;
  --paper-2:  #171717;
  --paper-3:  #202020;
  --rule:     #333333;
  --rule-dark:#e8e8e6;
  --sel:      #e8e8e6;
  --sel-text: #101010;
}
html[data-mode="light"] { color-scheme: light; }

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--sel); color: var(--sel-text); }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  overflow-x: hidden;
}
a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
img { display: block; max-width: 100%; height: auto; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.wrap { max-width: var(--max); margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); }
.read-wrap { max-width: 780px; }

/* ---- top rule ---- */
.topbar { border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.topbar .wrap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-top: 10px; padding-bottom: 10px; }
.topbar a { color: var(--ink-2); text-decoration: none; }
.topbar a:hover { color: var(--ink); text-decoration: underline; }
.topbar .brand { color: var(--ink); font-weight: 700; }
.topbar .brand img { display: inline-block; width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-modes { display: inline-flex; align-items: center; gap: 0; }
.topbar .modebtn { font-size: 0.58rem; padding: 3px 9px; letter-spacing: 0.1em; border-color: var(--ink-4); }
.topbar .modebtn + .modebtn { border-left: 0; }
.modebtn {
  font-family: var(--mono); font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  background: var(--paper); color: var(--ink-2);
  border: 1px solid var(--rule-dark); padding: 7px 14px; cursor: pointer;
}
.modebtn:hover { background: var(--paper-2); }
.modebtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---- doc title bar ---- */
.docbar { border-bottom: 1px solid var(--rule); }
.docbar .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding-top: 22px; padding-bottom: 22px; }
.docbar h1 { font-family: var(--mono); font-size: 1rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.docbar nav a { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; color: var(--ink-2); margin-left: 14px; }
.docbar nav a:hover { color: var(--ink); text-decoration: underline; }

/* ---- prose ---- */
#content { padding-top: 40px; padding-bottom: 80px; }
#content > *:first-child { margin-top: 0; }
#content h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.9rem, 4vw, 2.5rem); line-height: 1.15; letter-spacing: -0.01em; margin: 44px 0 18px; }
#content h2 {
  font-family: var(--serif); font-weight: 500; font-size: clamp(1.4rem, 3vw, 1.75rem);
  line-height: 1.2; margin: 44px 0 14px; padding-top: 22px; border-top: 1px solid var(--rule);
}
#content h3 { font-family: var(--mono); font-size: 0.74rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin: 34px 0 10px; }
#content p { margin: 0 0 18px; color: var(--ink-2); max-width: 74ch; }
#content strong { color: var(--ink); font-weight: 600; }
#content ul, #content ol { margin: 0 0 18px; padding-left: 24px; color: var(--ink-2); max-width: 74ch; }
#content li { margin: 6px 0; }
#content a { color: var(--ink); }
#content code {
  font-family: var(--mono); font-size: 0.84em;
  background: var(--paper-2); border: 1px solid var(--rule);
  padding: 1px 5px;
}
#content pre {
  margin: 0 0 22px; padding: 14px 18px; overflow-x: auto;
  background: var(--ink); color: var(--paper);
  font-family: var(--mono); font-size: 0.8rem; line-height: 1.65;
}
#content pre code { background: none; border: 0; padding: 0; color: inherit; font-size: 1em; }
#content blockquote {
  border-left: 3px solid var(--rule-dark);
  padding: 2px 0 2px 22px; margin: 0 0 22px;
  color: var(--ink-2); font-size: 0.95rem;
}
#content blockquote p { margin: 0 0 8px; }
#content blockquote p:last-child { margin: 0; }
#content blockquote strong { color: var(--ink); }
#content table { border-collapse: collapse; width: 100%; margin: 0 0 22px; font-size: 0.9rem; }
#content th, #content td { text-align: left; padding: 12px 16px 12px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
#content th { font-family: var(--mono); font-weight: 700; font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4); }
#content td { color: var(--ink-2); }
#content td:first-child { font-family: var(--mono); font-size: 0.8rem; font-weight: 700; color: var(--ink); }
#content hr { border: 0; border-top: 1px solid var(--rule); margin: 36px 0; }
#error { display: none; padding: 60px 0; color: var(--ink-3); font-family: var(--mono); font-size: 0.8rem; }

@media (max-width: 720px) {
  #content { padding-top: 28px; }
  .docbar nav a { margin-left: 10px; }
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <span class="brand"><a href="index.html"><img src="icon.png" alt="">dnsi / docs</a></span>
      <span class="topbar-right">
        <span class="topbar-modes" role="group" aria-label="Colour mode">
          <button class="modebtn" type="button" data-mode="light" aria-pressed="false">Paper</button>
          <button class="modebtn" type="button" data-mode="dark" aria-pressed="false">Ink</button>
        </span>
      </span>
    </div>
  </div>

  <div class="docbar">
    <div class="wrap read-wrap">
      <h1 id="docTitle">docs</h1>
      <nav>
        <a href="#" onclick="history.back(); return false;">Back</a>
        <a href="index.html">Home</a>
      </nav>
    </div>
  </div>

  <div class="wrap read-wrap">
    <div id="content" aria-live="polite"></div>
    <div id="error">
      <p>Could not load this document. <a href="index.html">Back to the landing page.</a></p>
    </div>
  </div>

  <script>
    /* ---- Mode (paper / ink), remembered across pages ---- */
    var KEY = 'dnsi-mode';
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    var modeButtons = document.querySelectorAll('.modebtn');

    function syncModeButtons(mode) {
      for (var i = 0; i < modeButtons.length; i++) {
        modeButtons[i].setAttribute('aria-pressed', modeButtons[i].dataset.mode === mode ? 'true' : 'false');
      }
    }
    function applyMode(mode) {
      document.documentElement.setAttribute('data-mode', mode);
      if (metaTheme) metaTheme.setAttribute('content', mode === 'dark' ? '#101010' : '#ffffff');
      syncModeButtons(mode);
      try { localStorage.setItem(KEY, mode); } catch (e) { /* private mode */ }
    }
    for (var i = 0; i < modeButtons.length; i++) {
      modeButtons[i].addEventListener('click', function (ev) { applyMode(ev.currentTarget.dataset.mode); });
    }

    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) { /* private mode */ }
    applyMode(saved === 'light' ? 'light' : 'dark');
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"
    integrity="sha384-XQqX/4yiUGu+oyr87jvWzRuqBUK/adrY0DunhL+tID9m/9dwSpV8h9Fk/Sg6ifVQ"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
    integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
    crossorigin="anonymous"
  ></script>
  <script>
    // Only these files may be loaded (no arbitrary fetch proxy).
    var DOCS = {
      "PLAIN.md": "PLAIN.md",
      "PROTOCOL.md": "PROTOCOL.md",
      "AGENTS.md": "AGENTS.md",
      "ARCHITECTURE.md": "ARCHITECTURE.md",
      "OPERATIONS.md": "OPERATIONS.md"
    };
    var params = new URLSearchParams(location.search);
    var doc = params.get("doc") || "PLAIN.md";
    var box = document.getElementById("content");
    var err = document.getElementById("error");
    var title = document.getElementById("docTitle");

    if (!Object.prototype.hasOwnProperty.call(DOCS, doc)) {
      box.style.display = "none";
      err.style.display = "block";
    } else {
      document.title = "DNSi: " + DOCS[doc];
      title.textContent = doc;
      fetch(doc, { headers: { "accept": "text/plain" } })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function (text) {
          if (typeof marked === "undefined") throw new Error("renderer unavailable");
          // marked only escapes what it must; parse output goes through a
          // sanitizer so a poisoned CDN copy cannot inject live script into
          // the docs reader.
          box.innerHTML = window.DOMPurify
            ? window.DOMPurify.sanitize(marked.parse(text))
            : marked.parse(text);
        })
        .catch(function () {
          box.style.display = "none";
          err.style.display = "block";
        });
    }
  </script>
</body>
</html>
